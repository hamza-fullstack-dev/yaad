name: yaad
description: yaadon ki kitaab — a to-do list and private diary
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State + DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Local DB
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.3
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.24

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  table_calendar: ^3.1.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Storage
  shared_preferences: ^2.2.3

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0

  # Utils
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

  # Assets
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/illustrations/
    - assets/onboarding/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#D4537E"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

flutter_native_splash:
  color: "#D4537E"
  image: "assets/branding/splash_logo.png"
  android_12:
    image: "assets/branding/splash_logo.png"
    icon_background_color: "#D4537E"